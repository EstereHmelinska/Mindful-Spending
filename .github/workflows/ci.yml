name: Mindful Spending CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        env:
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
          JWT_EXPIRATION_MS: '86400000'
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: mindful_spending
          DB_USERNAME: user
          DB_PASSWORD: ci-test-password
        run: ./mvnw --batch-mode clean verify
